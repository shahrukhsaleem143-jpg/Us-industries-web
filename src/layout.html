<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0b0b0b">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="US Industries">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">

  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="{{root}}assets/css/main.css">
  <script>document.documentElement.classList.add("js");</script>
  <script type="application/ld+json">{{schema}}</script>
</head>
<body data-page="{{page}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-veil" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-label">View</span></div>

  <!-- @include header -->

  <main id="main">
{{body}}
  </main>

  <!-- @include footer -->

  <script src="{{root}}assets/js/main.js" defer></script>
</body>
</html>
